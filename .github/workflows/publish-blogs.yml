name: Publish Scheduled Blogs

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of blogs to publish'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run publish script
        run: node tools/publish-blogs.js ${{ github.event.inputs.count || '3' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Blog health check
        run: python tools/blog_health_check.py --ci

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "📝 Auto-publish scheduled blogs [skip ci]" && git push)
